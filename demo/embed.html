<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 28px; }
      .host { max-width: 1100px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
    </style>
  </head>
  <body>
    <div class="host">
      <h1>Third-party website</h1>
      <p>This page is outside your React app. The widget loads from your backend.</p>

      <div id="widget-here"></div>

      <script
        src="http://localhost:4000/widget.js"
        data-target="#widget-here"
        data-accent="#7c3aed"
        data-layout="grid"
        data-limit="6"
        data-title="Loved by customers"
      ></script>
    </div>
  </body>
</html>
